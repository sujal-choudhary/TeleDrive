version: "3.8"

services:
  backend:
    build: ./Backend
    container_name: teledrive-backend
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DATABASE_URL=sqlite:////data/teledrive.db
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-524288000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    volumes:
      - teledrive-data:/data
    ports:
      - "5000:5000"
    networks:
      - teledrive-network

  frontend:
    build: ./frontend
    container_name: teledrive-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - teledrive-network

volumes:
  teledrive-data:

networks:
  teledrive-network:
    driver: bridge